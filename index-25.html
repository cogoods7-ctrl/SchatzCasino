<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<meta name="description" content="The Schatz — a private card room. Blackjack, Texas Hold'em, Omaha, Draw, Stud and Four Card Poker with friends. Play chips only.">
<title>The Schatz · Card Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0907' stroke='%23c9a45c' stroke-width='3'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23c9a45c' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gold:#c9a45c; --gold-hi:#ecd49a; --gold-lo:#8a6a2e; --ivory:#efe7d4; --muted:#a79c86;
  --ink:#0b0a08; --panel:rgba(16,13,10,.94); --line:rgba(201,164,92,.28);
  --felt:#17573a; --felt-deep:#0a2c1d; --burg:#6b1424; --red:#b3132b;
  --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Cormorant Garamond","Hoefler Text",Georgia,"Times New Roman",serif;
  --sans:"Optima","Candara","Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--ivory); font-family:var(--sans); background:#080706;
  background-image:
    radial-gradient(1100px 620px at 50% -8%, rgba(120,84,40,.28), transparent 65%),
    radial-gradient(900px 600px at 50% 120%, rgba(60,10,18,.35), transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0}

/* ---------- buttons ---------- */
.btn{
  appearance:none; cursor:pointer; border:1px solid var(--gold-lo); border-radius:3px;
  background:linear-gradient(#1d1a15,#12100d); color:var(--gold-hi);
  padding:.62em 1.15em; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
  transition:border-color .15s, background .15s, transform .05s, color .15s; white-space:nowrap;
}
.btn:hover{border-color:var(--gold); color:#fff6dc}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(#efd696,#c39c4f 55%,#a5803a); color:#1b1207; border-color:#e9cf8c; font-weight:600}
.btn.primary:hover{background:linear-gradient(#f7e2a8,#d2ab5b 55%,#b08a42); color:#120b03}
.btn.danger{border-color:#7d2433; color:#e8a9b2}
.btn.danger:hover{border-color:#b13246; color:#ffd0d7}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:.5em .8em}
.btn.ghost:hover{color:var(--gold-hi); border-color:var(--line)}
.btn.ghost.on{color:var(--gold-hi); border-color:var(--line)}
.btn.big{font-size:.86rem; padding:.85em 1.5em}

/* ---------- lobby ---------- */
#lobby{display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px}
.lobby-inner{width:min(560px,100%);text-align:center;margin:auto}
.lobby-inner .crest{margin:0 -200px}
@media (max-width:640px){.lobby-inner .crest{margin:0}}
.crest-top{font-family:var(--serif);letter-spacing:.5em;font-size:.72rem;color:var(--gold);text-indent:.5em}
.wordmark{
  font-family:var(--serif); font-weight:400; margin:.18em 0 .1em; line-height:1;
  font-size:clamp(2.2rem,9vw,4.8rem); letter-spacing:.14em; text-indent:.14em; white-space:nowrap;
  background:linear-gradient(180deg,#fbeec6 0%,#e2c47e 38%,#a9823b 62%,#e7cf8f 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 14px rgba(201,164,92,.18));
}
.crest-sub{font-size:.72rem;letter-spacing:.38em;color:var(--muted);text-transform:uppercase;text-indent:.38em}
.rule{display:flex;align-items:center;gap:14px;margin:22px auto 26px;width:70%;color:var(--gold)}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
.rule i{font-style:normal;font-size:.8rem}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 4px rgba(10,8,6,.9), inset 0 0 0 5px rgba(201,164,92,.12);
  text-align:left;
}
.field{display:block;margin-bottom:18px}
.field>span{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input,.field select,.inp{
  width:100%; background:#0c0b09; border:1px solid #3a3124; border-radius:3px; padding:.75em .9em;
  color:var(--ivory); outline:none; font-size:1rem;
}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--gold)}
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;margin-top:10px;
  background:linear-gradient(#17140f,#100e0b); border:1px solid #3a3124; border-radius:3px; padding:16px 18px;
  transition:border-color .15s, background .15s;
}
button.choice:hover{border-color:var(--gold)}
.choice-t{display:block;font-family:var(--serif);font-size:1.2rem;color:var(--gold-hi);letter-spacing:.04em}
.choice-d{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}
.join-row{display:flex;gap:8px;margin-top:10px}
.join-row input{flex:1;min-width:0;background:#0c0b09;border:1px solid #3a3124;border-radius:3px;padding:.5em .6em;color:var(--gold-hi);outline:none;text-transform:uppercase;letter-spacing:.4em;font-family:var(--serif);font-size:1.15rem;text-align:center}
.fine{font-size:.72rem;color:#7d735f;margin-top:22px;letter-spacing:.04em}

/* ---------- table screen ---------- */
#tableScreen{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(201,164,92,.14);background:rgba(8,7,6,.7);backdrop-filter:blur(6px);min-height:50px}
.tb-left{display:flex;align-items:baseline;gap:16px;min-width:0}
.mini-mark{font-family:var(--serif);letter-spacing:.3em;color:var(--gold);font-size:1rem;white-space:nowrap}
.tb-game{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.room-code{cursor:pointer;background:#0d0c0a;border:1px solid var(--line);color:var(--gold-hi);font-family:var(--serif);letter-spacing:.28em;padding:.4em .8em;border-radius:3px;font-size:.85rem;margin-right:6px}
.room-code small{font-family:var(--sans);letter-spacing:.14em;color:var(--muted);font-size:.6rem;margin-right:8px}
.room-code:hover{border-color:var(--gold)}
.badge-dot{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:.62rem;letter-spacing:0;margin-left:5px;padding:0 4px;vertical-align:1px}
.table-area{position:relative;display:grid;grid-template-columns:1fr 300px;min-height:0}
.felt-zone{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}

/* the table */
.table-wrap{position:relative;container-type:inline-size;--cw:clamp(26px,4.3cqw,58px)}
.rail{
  position:absolute; inset:0; border-radius:999px;
  background:
    radial-gradient(120% 140% at 50% 0%, rgba(255,220,170,.10), transparent 40%),
    linear-gradient(180deg,#4b2c19 0%,#2a170c 45%,#1a0e07 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.75), 0 0 0 1px #0a0604, inset 0 2px 0 rgba(255,220,170,.18), inset 0 -3px 8px rgba(0,0,0,.6);
}
.felt{
  position:absolute; inset:3.6cqw; border-radius:999px; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 42%, #22744c 0%, #17573a 45%, #0f4029 75%, #0a2c1d 100%);
  box-shadow: 0 0 0 2px #8a6a2e, 0 0 0 4px #1a0e07, inset 0 0 6cqw rgba(0,0,0,.55), inset 0 3px 10px rgba(0,0,0,.6);
}
.felt:before{ /* cloth texture */
  content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
  background:repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
             repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 4px);
}
.felt:after{ /* betting line */
  content:"";position:absolute;inset:11% 8%;border-radius:999px;border:1px solid rgba(233,207,143,.20);
}
.table-wrap.halfmoon .rail{border-radius:0 0 50% 50% / 0 0 100% 100%}
.table-wrap.halfmoon .felt{border-radius:0 0 50% 50% / 0 0 100% 100%}
.table-wrap.halfmoon .felt:after{display:none}
.table-wrap.halfmoon .seat{transform:translate(-50%,-70%)}
.table-wrap.halfmoon .plate{min-width:clamp(84px,10.5cqw,128px)}
.center.dealer-c{transform:translate(-50%,0)}
.join-row input:focus{border-color:var(--gold)}
.table-wrap.portrait{--cw:clamp(22px,7.6cqw,46px)}
#tableLayer{position:absolute;inset:0}
.felt-print{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.felt-print text{font-family:var(--serif);fill:rgba(236,212,154,.24);letter-spacing:.22em}
.logo-print{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap}
.logo-print b{display:block;font-family:var(--serif);font-weight:400;font-size:3.1cqw;letter-spacing:.42em;text-indent:.42em;color:rgba(236,212,154,.15)}
.logo-print i{display:block;font-style:normal;font-size:1cqw;letter-spacing:.6em;text-indent:.6em;color:rgba(236,212,154,.12);margin-top:.5cqw}
.portrait.oval .dealer-plq{display:none}
.portrait .logo-print b{font-size:6cqw}.portrait .logo-print i{font-size:2cqw}

/* cards */
.card{
  position:relative; width:var(--cw); height:calc(var(--cw)*1.4); border-radius:calc(var(--cw)*.09);
  background:linear-gradient(160deg,#fffdf7,#f3ecdc); box-shadow:0 1px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.45);
  font-family:var(--serif); flex:none; user-select:none;
}
.card.blk{color:#141414}.card.red{color:#b0142a}
.card .ci{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9}
.card .ci b{font-size:calc(var(--cw)*.34);font-weight:600;letter-spacing:-.04em}
.card .ci i{font-style:normal;font-size:calc(var(--cw)*.26);font-family:"Segoe UI Symbol","Apple Symbols",var(--serif)}
.card .tl{top:7%;left:8%}
.card .br{bottom:7%;right:8%;transform:rotate(180deg)}
.card .cc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.62);font-family:"Segoe UI Symbol","Apple Symbols",var(--serif)}
.card .cc.face{font-size:calc(var(--cw)*.56);font-weight:600}
.card .cc.face:before,.card .cc.face:after{content:"";position:absolute;inset:22% 20%;border:1px solid currentColor;opacity:.22;border-radius:2px}
.card.back{
  background:
    repeating-linear-gradient(45deg, rgba(233,207,143,.28) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(233,207,143,.28) 0 1px, transparent 1px 7px),
    linear-gradient(160deg,#7a1628,#4a0b17);
  border:calc(var(--cw)*.07) solid #f6f0e2;
}
.card.back:after{content:"";position:absolute;inset:6%;border:1px solid rgba(233,207,143,.5);border-radius:2px}
.card.hole{box-shadow:0 0 0 2px rgba(120,170,255,.55), 0 4px 10px rgba(0,0,0,.45)}
.card.sel{transform:translateY(-22%);box-shadow:0 0 0 2px var(--gold-hi),0 10px 18px rgba(0,0,0,.5)}
.card.pick{cursor:pointer}
.card.pick:hover{transform:translateY(-10%)}
.card.sel.pick:hover{transform:translateY(-22%)}
.card.dim{filter:brightness(.55) saturate(.6)}
.card.slot{background:transparent;box-shadow:none;border:1px dashed rgba(233,207,143,.22)}
.card.fresh{animation:deal .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes deal{from{opacity:0;transform:translateY(-40%) scale(.85) rotate(-6deg)}to{opacity:1;transform:none}}
.cards{display:flex;align-items:flex-end;justify-content:center}
.cards .card+.card{margin-left:calc(var(--cw)*-.42)}
.cards.n5 .card+.card,.cards.n6 .card+.card,.cards.n7 .card+.card{margin-left:calc(var(--cw)*-.56)}
.seat.me .cards .card+.card{margin-left:calc(var(--cw)*-.3)}
.cards.wide .card+.card,.seat.me .cards.wide .card+.card{margin-left:calc(var(--cw)*.08)}
.cards .card.up{transform:none}

/* seats */
.seat{position:absolute;transform:translate(-50%,-62%);display:flex;flex-direction:column;align-items:center;gap:.6cqw;z-index:3}
.seat.top{flex-direction:column-reverse;transform:translate(-50%,-38%)}
.seat.me{--cw:clamp(30px,5.2cqw,68px)}
.portrait .seat{--cw:clamp(16px,5.4cqw,30px)}
.portrait .seat.me{--cw:clamp(30px,10cqw,54px)}
.portrait .hname{font-size:.58rem;padding:1px 6px}
.portrait .tray{display:none}
.seat .cards{min-height:calc(var(--cw)*1.4)}
.plate{
  position:relative; min-width:clamp(92px,12.5cqw,150px); padding:.5em .8em .55em; border-radius:4px;
  background:linear-gradient(#17130e,#0c0a08); border:1px solid #3d3326; text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.55); line-height:1.15;
}
.portrait .plate{min-width:clamp(78px,24cqw,120px);font-size:.85em}
.plate .nm{font-size:.82rem;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:block}
.plate .ch{font-family:var(--serif);color:var(--gold-hi);font-size:.95rem;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.plate .st{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:1em;margin-top:2px;white-space:nowrap}
.plate .tag{position:absolute;top:-8px;right:-6px;font-size:.55rem;letter-spacing:.14em;padding:2px 5px;border-radius:2px;background:#2a2318;color:var(--gold);border:1px solid #4b3d27}
.plate .tag.host{left:-6px;right:auto;background:#2a1418;color:#e7b3bc;border-color:#5c2531}
.seat.me .plate{border-color:var(--gold-lo)}
.seat.acting .plate{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 24px rgba(236,212,154,.35),0 8px 20px rgba(0,0,0,.55)}
.seat.folded .plate,.seat.out .plate{opacity:.5}
.seat.away .nm:after{content:" · away";color:#c98f8f;font-size:.7em}
.seat.win .plate{border-color:var(--gold-hi);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px rgba(236,212,154,.3)}to{box-shadow:0 0 26px rgba(236,212,154,.7)}}
.tbar{position:absolute;left:6px;right:6px;bottom:3px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e7cf8f,#c9a45c);transform-origin:left;transition:background .3s}
.tbar.low i{background:#c0392b}
.hname{font-size:.7rem;letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.6);color:var(--ivory);white-space:nowrap}
.hname.gold{background:linear-gradient(#efd696,#b8913f);color:#1b1207;font-weight:600}
.won{font-family:var(--serif);color:var(--gold-hi);font-size:1rem}
.open-seat{position:absolute;transform:translate(-50%,-50%);width:clamp(70px,9cqw,110px);height:clamp(30px,3.6cqw,44px);border:1px dashed rgba(233,207,143,.22);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.58rem;letter-spacing:.18em;color:rgba(233,207,143,.4);text-transform:uppercase;z-index:2;background:rgba(0,0,0,.15)}
.open-seat.add{cursor:pointer}
.open-seat.add:hover{border-color:var(--gold);color:var(--gold-hi)}

/* chips */
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;z-index:2;pointer-events:none}
.bet span{font-family:var(--serif);font-size:.8rem;color:#fff6dc;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:9px;font-variant-numeric:tabular-nums}
.stack{position:relative;width:var(--chip,22px);height:calc(var(--chip,22px) + 8px)}
.chip{
  position:absolute;left:0;width:var(--chip,22px);height:var(--chip,22px);border-radius:50%;
  background:repeating-conic-gradient(var(--c) 0 30deg, #f4efe4 30deg 45deg);
  box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.25);
}
.chip:after{content:"";position:absolute;inset:20%;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:clamp(18px,2.2cqw,28px);height:clamp(18px,2.2cqw,28px);border-radius:50%;background:radial-gradient(#fff,#ddd6c4);color:#111;font:700 clamp(9px,1.1cqw,13px)/1 var(--serif);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.6);z-index:2}

/* center */
.center{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.9cqw;z-index:2;text-align:center}
.stage{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(236,212,154,.75)}
.pot{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.05rem;color:#fff6dc;background:rgba(0,0,0,.45);padding:3px 12px 3px 6px;border-radius:14px}
.pot small{font-family:var(--sans);font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.banner{font-family:var(--serif);font-size:1.05rem;color:var(--gold-hi);background:rgba(0,0,0,.55);padding:6px 16px;border-radius:3px;border:1px solid rgba(201,164,92,.35);max-width:60cqw}
.notice{font-size:.8rem;color:var(--ivory);background:rgba(0,0,0,.45);padding:8px 14px;border-radius:3px;letter-spacing:.04em;max-width:55cqw}
.dealer-plq{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:3;padding:.3em 1em;border-radius:3px;background:linear-gradient(#17130e,#0c0a08);border:1px solid var(--gold-lo);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.tray{position:absolute;left:50%;top:3.6cqw;transform:translateX(-50%);display:flex;gap:2px;padding:3px 5px;background:linear-gradient(#0d0a07,#1c140d);border:1px solid #3d2c1a;border-top:none;border-radius:0 0 4px 4px;z-index:1}
.tray i{display:block;width:1.3cqw;height:2.4cqw;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 -2px 0 rgba(255,255,255,.25)}
.bj-hands{display:flex;gap:1.2cqw;align-items:flex-end}
.bj-hand{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.bj-hand.cur:before{content:"";position:absolute;inset:-6px -6px -4px;border:1px solid var(--gold-hi);border-radius:6px;box-shadow:0 0 14px rgba(236,212,154,.35)}
.bj-hand .cards .card+.card{margin-left:calc(var(--cw)*-.62)}
.tot{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.65);color:#fff;font-variant-numeric:tabular-nums}
.res{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;padding:2px 6px;border-radius:2px;font-weight:600}
.res.win,.res.blackjack{background:linear-gradient(#efd696,#b8913f);color:#1b1207}
.res.lose,.res.bust,.res.fold{background:#3b1219;color:#f0b8c1}
.res.push{background:#2b2b2b;color:#ddd}
.circle{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,4.6cqw,58px);height:clamp(22px,3.2cqw,40px);border:1px solid rgba(236,212,154,.25);border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center}
.fc-lines{font-size:.62rem;color:var(--muted);text-align:center;line-height:1.3;max-width:160px}

/* side panel */
.side{display:flex;flex-direction:column;border-left:1px solid rgba(201,164,92,.14);background:rgba(10,9,7,.8);min-height:0}
.tabs{display:flex;border-bottom:1px solid rgba(201,164,92,.14)}
.tabs button{flex:1;background:none;border:none;padding:11px;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.feed{flex:1;overflow-y:auto;padding:12px 14px;font-size:.82rem;line-height:1.45;min-height:0}
.feed .m{margin-bottom:6px;word-wrap:break-word}
.feed .m b{color:var(--gold-hi);font-weight:600}
.feed .lg{color:#b9ae96;font-size:.76rem;margin-bottom:4px}

<script>
// =====================================================================
//  CARDS & HAND EVALUATION
// =====================================================================
const RANKS = '23456789TJQKA', SUITS = 'cdhs';
const RV = {}; [...RANKS].forEach((r, i) => RV[r] = i + 2);
const RANK_NAME = {2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight',9:'Nine',10:'Ten',11:'Jack',12:'Queen',13:'King',14:'Ace'};
const RANK_PLURAL = r => r === 6 ? 'Sixes' : RANK_NAME[r] + 's';
const SUIT_SYM = { c: '♣', d: '♦', h: '♥', s: '♠' };

function newDeck(n = 1) {
  const d = [];
  for (let k = 0; k < n; k++) for (const s of SUITS) for (const r of RANKS) d.push(r + s);
  return d;
}
function secureRandom() {
  const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296;
}
function shuffle(a, rnd = secureRandom) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
const COMBO_CACHE = {};
function comboIdx(n, k) {
  const key = n + '_' + k;
  if (COMBO_CACHE[key]) return COMBO_CACHE[key];
  const out = [], cur = [];
  (function rec(s) {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = s; i < n; i++) { cur.push(i); rec(i + 1); cur.pop(); }
  })(0);
  return (COMBO_CACHE[key] = out);
}

const P5 = 16 ** 5;
function packScore(cat, k) { let s = cat; for (let i = 0; i < 5; i++) s = s * 16 + (k[i] || 0); return s; }
function unpackScore(s) {
  const cat = Math.floor(s / P5); let r = s % P5; const k = [];
  for (let i = 4; i >= 0; i--) { k[i] = r % 16; r = Math.floor(r / 16); }
  return { cat, k };
}
function groupsOf(v) { // v sorted desc -> [[rank,count]...] sorted by count desc then rank desc
  const g = [];
  for (let i = 0; i < v.length;) { let j = i; while (j < v.length && v[j] === v[i]) j++; g.push([v[i], j - i]); i = j; }
  g.sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  return g;
}

// ---- 5-card poker (categories 0..8) ----
// 0 High, 1 Pair, 2 Two Pair, 3 Trips, 4 Straight, 5 Flush, 6 Full House, 7 Quads, 8 Straight Flush
function eval5(cs) {
  const v = [RV[cs[0][0]], RV[cs[1][0]], RV[cs[2][0]], RV[cs[3][0]], RV[cs[4][0]]].sort((a, b) => b - a);
  const s0 = cs[0][1];
  const fl = cs[1][1] === s0 && cs[2][1] === s0 && cs[3][1] === s0 && cs[4][1] === s0;
  const g = groupsOf(v);
  let st = 0;
  if (g.length === 5) { if (v[0] - v[4] === 4) st = v[0]; else if (v[0] === 14 && v[1] === 5) st = 5; }
  if (st && fl) return packScore(8, [st]);
  if (g[0][1] === 4) return packScore(7, [g[0][0], g[1][0]]);
  if (g[0][1] === 3 && g[1][1] === 2) return packScore(6, [g[0][0], g[1][0]]);
  if (fl) return packScore(5, v);
  if (st) return packScore(4, [st]);
  if (g[0][1] === 3) return packScore(3, g.map(x => x[0]));
  if (g[0][1] === 2 && g[1][1] === 2) return packScore(2, g.map(x => x[0]));
  if (g[0][1] === 2) return packScore(1, g.map(x => x[0]));
  return packScore(0, v);
}
// fewer than 5 cards (stud "showing" hands / early streets): pairs only, no straights/flushes
function evalPartial(cs) {
  if (!cs.length) return 0;
  const v = cs.map(c => RV[c[0]]).sort((a, b) => b - a);
  const g = groupsOf(v);
  const k = g.map(x => x[0]);
  if (g[0][1] === 4) return packScore(7, k);
  if (g[0][1] === 3) return packScore(3, k);
  if (g[0][1] === 2 && g[1] && g[1][1] === 2) return packScore(2, k);
  if (g[0][1] === 2) return packScore(1, k);
  return packScore(0, v);
}
function best5(cards) {
  if (cards.length < 5) return { score: evalPartial(cards), cards: cards.slice() };
  if (cards.length === 5) return { score: eval5(cards), cards: cards.slice() };
  let b = -1, bh = null;
  for (const ix of comboIdx(cards.length, 5)) {
    const h = [cards[ix[0]], cards[ix[1]], cards[ix[2]], cards[ix[3]], cards[ix[4]]];
    const s = eval5(h); if (s > b) { b = s; bh = h; }
  }
  return { score: b, cards: bh };
}
function bestOmaha(hole, board) { // exactly 2 hole + 3 board
  if (board.length < 3) return { score: evalPartial(hole), cards: hole.slice() };
  let b = -1, bh = null;
  for (const hi of comboIdx(hole.length, 2)) for (const bi of comboIdx(board.length, 3)) {
    const h = [hole[hi[0]], hole[hi[1]], board[bi[0]], board[bi[1]], board[bi[2]]];
    const s = eval5(h); if (s > b) { b = s; bh = h; }
  }
  return { score: b, cards: bh };
}
const CAT5 = ['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush','Royal Flush'];
function catIndex5(s) { const { cat, k } = unpackScore(s); return cat === 8 && k[0] === 14 ? 9 : cat; }
function describe5(s) {
  const { cat, k } = unpackScore(s); const N = RANK_NAME, PL = RANK_PLURAL;
  switch (cat) {
    case 8: return k[0] === 14 ? 'Royal Flush' : `Straight Flush, ${N[k[0]]}-high`;
    case 7: return `Four of a Kind, ${PL(k[0])}`;
    case 6: return `Full House, ${PL(k[0])} over ${PL(k[1])}`;
    case 5: return `Flush, ${N[k[0]]}-high`;
    case 4: return `Straight, ${N[k[0]]}-high`;
    case 3: return `Three of a Kind, ${PL(k[0])}`;
    case 2: return `Two Pair, ${PL(k[0])} and ${PL(k[1])}`;
    case 1: return `Pair of ${PL(k[0])}`;
    default: return k[0] ? `${N[k[0]]}-high` : '';
  }
}
function describeHole(cards) { // pre-flop hold'em description
  if (cards.length !== 2) return '';
  const a = RV[cards[0][0]], b = RV[cards[1][0]];
  if (a === b) return `Pocket ${PL_(a)}`;
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return `${RANK_NAME[hi]}-${RANK_NAME[lo]} ${cards[0][1] === cards[1][1] ? 'suited' : 'offsuit'}`;
}
function PL_(r) { return RANK_PLURAL(r); }

// ---- 4-card poker (Four Card Poker table game) ----
// 0 High, 1 Pair, 2 Two Pair, 3 Straight, 4 Flush, 5 Trips, 6 Straight Flush, 7 Quads
function eval4(cs) {
  const v = cs.map(c => RV[c[0]]).sort((a, b) => b - a);
  const fl = cs.every(c => c[1] === cs[0][1]);
  const g = groupsOf(v);
  let st = 0;
  if (g.length === 4) { if (v[0] - v[3] === 3) st = v[0]; else if (v[0] === 14 && v[1] === 4 && v[3] === 2) st = 4; }
  if (g[0][1] === 4) return packScore(7, [g[0][0]]);
  if (st && fl) return packScore(6, [st]);
  if (g[0][1] === 3) return packScore(5, g.map(x => x[0]));
  if (fl) return packScore(4, v);
  if (st) return packScore(3, [st]);
  if (g[0][1] === 2 && g[1][1] === 2) return packScore(2, g.map(x => x[0]));
  if (g[0][1] === 2) return packScore(1, g.map(x => x[0]));
  return packScore(0, v);
}
function best4(cards) {
  let b = -1, bh = null;
  for (const ix of comboIdx(cards.length, 4)) {
    const h = ix.map(i => cards[i]); const s = eval4(h); if (s > b) { b = s; bh = h; }
  }
  return { score: b, cards: bh };
}
const CAT4 = ['High Card','One Pair','Two Pair','Straight','Flush','Three of a Kind','Straight Flush','Four of a Kind'];
function describe4(s) {
  const { cat, k } = unpackScore(s); const N = RANK_NAME, PL = RANK_PLURAL;
  switch (cat) {
    case 7: return `Four of a Kind, ${PL(k[0])}`;
    case 6: return `Straight Flush, ${N[k[0]]}-high`;
    case 5: return `Three of a Kind, ${PL(k[0])}`;
    case 4: return `Flush, ${N[k[0]]}-high`;
    case 3: return `Straight, ${N[k[0]]}-high`;
    case 2: return `Two Pair, ${PL(k[0])} and ${PL(k[1])}`;
    case 1: return `Pair of ${PL(k[0])}`;
    default: return `${N[k[0]]}-high`;
  }
}

// stud bring-in ordering: rank, then suit (clubs lowest, spades highest)
function lowCardValue(c) { return RV[c[0]] * 4 + SUITS.indexOf(c[1]); }

// ---- Blackjack ----
function bjValue(cards) {
  let t = 0, a = 0;
  for (const c of cards) {
    const r = c[0];
    if (r === 'A') { a++; t += 11; } else if ('TJQK'.includes(r)) t += 10; else t += +r;

function isBlackjack(cards) { return cards.length === 2 && bjValue(cards).total === 21; }
// =====================================================================
//  GAME ENGINE  (runs only in the host's browser — the "house")
// =====================================================================
const MAXSEATS = 7;
const STAKES = [
  { sb: 5, bb: 10 }, { sb: 10, bb: 20 }, { sb: 25, bb: 50 },
  { sb: 50, bb: 100 }, { sb: 100, bb: 200 }, { sb: 250, bb: 500 }, { sb: 500, bb: 1000 }

const GAMES = {
  holdem:    { name: "Texas Hold'em",   kind: 'poker',     limit: 'NL', label: "No-Limit Texas Hold'em" },
  omaha:     { name: 'Omaha',           kind: 'poker',     limit: 'PL', label: 'Pot-Limit Omaha' },
  draw:      { name: 'Five Card Draw',  kind: 'poker',     limit: 'NL', label: 'No-Limit Five Card Draw' },
  stud7:     { name: 'Seven Card Stud', kind: 'poker',     limit: 'FL', label: 'Seven Card Stud' },
  stud5:     { name: 'Five Card Stud',  kind: 'poker',     limit: 'FL', label: 'Five Card Stud' },
  blackjack: { name: 'Blackjack',       kind: 'blackjack', label: 'Blackjack' },
  fourcard:  { name: 'Four Card Poker', kind: 'fourcard',  label: 'Four Card Poker' },
};
const BOT_NAMES = ['Vincent','Sal','Lola','Mickey','Rosa','Frankie','Dmitri','Ines','Archie','Celeste','Benny','Marguerite','Otto','Delphine','Leon','Vera'];
const PERSONAS = [
  { style: 'Tight',      tight: 0.07,  aggr: 0.35, bluff: 0.03 },
  { style: 'Loose',      tight: -0.04, aggr: 0.40, bluff: 0.09 },
  { style: 'Aggressive', tight: 0.01,  aggr: 0.75, bluff: 0.13 },

];

const ANTE_BONUS = { 7: 25, 6: 20, 5: 2 };
const fmt = n => Math.round(n).toLocaleString('en-US');

class Table {
  constructor(code, hostId, opts = {}) {
    this.code = code; this.hostId = hostId;
    this.now = opts.now || (() => Date.now());
    this.onChange = opts.onChange || (() => {});
    this.rnd = opts.rnd || Math.random;
    this.settings = { game: 'holdem', stakes: 2, startStack: 10000, timer: 30 };
    this.players = []; this.hand = null; this.handNo = 0; this.buttonSeat = -1;
    this.log = []; this.chat = []; this.paused = false; this.nextHandAt = 0;
    this.shoe = null; this.botSeq = 0; this.lastBets = {}; this.waitMsg = '';
  }
  changed() { this.onChange(); }
  addLog(m) { this.log.push({ t: this.now(), m }); if (this.log.length > 150) this.log.splice(0, this.log.length - 150); }
  player(id) { return this.players.find(p => p.id === id); }
  seated() { return this.players.filter(p => p.seat != null).sort((a, b) => a.seat - b.seat); }
  freeSeat() {
    const used = new Set(this.players.filter(p => p.seat != null).map(p => p.seat));
    for (let i = 0; i < MAXSEATS; i++) if (!used.has(i)) return i;
    return null;
  }
  inHand(id) { return !!(this.hand && !this.hand.over && this.hand.seats[id]); }
  stakes() { return STAKES[this.settings.stakes]; }
  uniqueName(name, selfId) {
    let n = name, i = 2;
    while (this.players.some(p => p.id !== selfId && p.name.toLowerCase() === n.toLowerCase())) n = name + ' ' + (i++);
    return n;
  }

  // ---------------- seating ----------------
  join(id, name, isBot = false) {
    name = String(name || 'Player').replace(/[<>]/g, '').trim().slice(0, 16) || 'Player';
    const existing = this.player(id);
    if (existing) {
      existing.connected = true; existing.leaving = false;
      this.addLog(`${existing.name} is back at the table.`); this.changed();
      return { ok: true };
    }
    let seat = this.freeSeat();
    if (seat == null) {
      if (isBot) return { ok: false, msg: 'No open seats.' };
      const idle = this.players.find(q => q.bot && q.seat != null && !q.leaving && !this.inHand(q.id));
      if (idle) { this.players = this.players.filter(q => q !== idle); seat = this.freeSeat(); this.addLog(`${idle.name} gives up a seat.`); }
      else {
        const busy = this.players.find(q => q.bot && q.seat != null && !q.leaving);
        if (!busy) return { ok: false, msg: 'This table is full (7 seats).' };
        busy.leaving = true; seat = null; // seated after this hand
      }
    }
    const p = {
      id, name: this.uniqueName(name, id), chips: this.settings.startStack, bot: isBot,
      persona: isBot ? PERSONAS[Math.floor(this.rnd() * PERSONAS.length)] : null,
      connected: true, seat, sittingOut: false, leaving: false,
    };
    this.players.push(p);
    this.addLog(seat == null ? `${p.name} joins and will be seated after this hand.` : `${p.name} takes seat ${seat + 1}.`);
    this.changed();
    return { ok: true };
  }
  addBot() {
    if (this.freeSeat() == null) return false;
    const used = new Set(this.players.map(p => p.name));
    const pool = BOT_NAMES.filter(n => !used.has(n));
    const name = pool.length ? pool[Math.floor(this.rnd() * pool.length)] : 'Bot ' + (this.botSeq + 1);
    return this.join('bot-' + (++this.botSeq), name, true).ok;
  }
  removeBot() {
    const bots = this.players.filter(p => p.bot && !p.leaving);
    if (!bots.length) return;
    const b = bots.find(x => !this.inHand(x.id)) || bots[bots.length - 1];
    this.removePlayer(b.id);
  }
  removePlayer(id) {
    const p = this.player(id); if (!p) return;
    if (this.inHand(id)) { p.leaving = true; p.connected = false; this.addLog(`${p.name} will leave after this hand.`); }
    else { this.players = this.players.filter(q => q.id !== id); this.addLog(`${p.name} leaves the table.`); }
    this.changed();
  }
  disconnected(id) {
    const p = this.player(id); if (!p || p.bot) return;
    p.connected = false; this.addLog(`${p.name} lost connection.`); this.changed();
  }
  tidy() {
    const before = this.players.length;
    this.players = this.players.filter(p => !p.leaving);
    const st = this.stakes(); const kind = GAMES[this.settings.game].kind;
    for (const p of this.players) {
      if (p.bot && (p.chips <= 0 || (kind !== 'poker' && p.chips < st.bb * 2))) {
        p.chips = this.settings.startStack; this.addLog(`${p.name} buys back in for ${fmt(p.chips)}.`);
      }
    }
    for (const p of this.players) {
      if (p.seat == null) {
        let s = this.freeSeat();
        if (s == null) {
          const bot = this.players.find(q => q.bot && q.seat != null);
          if (bot) { this.players = this.players.filter(q => q !== bot); s = this.freeSeat(); }
        }
        if (s != null) { p.seat = s; this.addLog(`${p.name} takes seat ${s + 1}.`); }
      }
    }
    return before !== this.players.length;
  }

  // ---------------- commands from players ----------------
  command(pid, c) {
    const p = this.player(pid); if (!p || !c) return;
    const isHost = pid === this.hostId;
    switch (c.t) {
      case 'act': this.act(pid, c.a || {}); break;
      case 'chat': {
        const m = String(c.m || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 240);
        if (!m) return;
        this.chat.push({ n: p.name, m, t: this.now(), id: pid });
        if (this.chat.length > 120) this.chat.splice(0, this.chat.length - 120);
        this.changed(); break;
      }
      case 'rebuy':
        if (!this.inHand(pid) && p.chips < this.settings.startStack) {
          p.chips = this.settings.startStack; this.addLog(`${p.name} rebuys to ${fmt(p.chips)}.`); this.changed();
        } break;
      case 'sitout': p.sittingOut = !!c.v; this.changed(); break;
      case 'leave': this.removePlayer(pid); break;
      case 'settings': if (isHost) this.applySettings(c.s || {}); break;
      case 'addBot': if (isHost) { this.addBot(); } break;
      case 'removeBot': if (isHost) this.removeBot(); break;
      case 'fillBots': if (isHost) { while (this.freeSeat() != null && this.addBot()); } break;
      case 'clearBots': if (isHost) { for (const b of this.players.filter(x => x.bot)) this.removePlayer(b.id); } break;
      case 'kick': if (isHost && c.id !== this.hostId) this.removePlayer(c.id); break;
      case 'pause': if (isHost) { this.paused = !!c.v; this.addLog(this.paused ? 'The host paused the table after this hand.' : 'The host resumed the table.'); this.changed(); } break;
      case 'dealNow': if (isHost && (!this.hand || this.hand.over)) { this.nextHandAt = 0; this.paused = false; this.changed(); } break;
    }
  }
  applySettings(s) {
    const st = this.settings; let changedGame = false;
    if (s.game && GAMES[s.game] && s.game !== st.game) { st.game = s.game; changedGame = true; }
    if (s.stakes != null && STAKES[+s.stakes]) st.stakes = +s.stakes;
    if (s.startStack != null) st.startStack = Math.max(500, Math.min(10000000, Math.floor(+s.startStack) || 10000));
    if (s.timer != null) st.timer = Math.max(10, Math.min(120, Math.floor(+s.timer) || 30));
    if (changedGame) this.addLog(this.hand && !this.hand.over ? `Next hand: ${GAMES[st.game].label}.` : `The table switches to ${GAMES[st.game].label}.`);
    this.changed();
  }

  // ---------------- clock ----------------
  tick() {
    const now = this.now(); const h = this.hand;
    if (h && !h.over) return this.tickHand(h, now);
    if (this.paused || now < this.nextHandAt) return;
    const tidied = this.tidy();
    if (this.startHand()) { this.waitMsg = ''; return; }
    const kind = GAMES[this.settings.game].kind;
    const msg = kind === 'poker' ? 'Waiting for at least 2 players with chips. The host can add bots.' : 'Waiting for players with enough chips to bet.';
    this.nextHandAt = now + 1000;
    if (this.waitMsg !== msg || tidied) { this.waitMsg = msg; this.changed(); }
  }
  tickHand(h, now) {
    if (h.pendingAt) {
      if (now >= h.pendingAt) { const fn = h.pendingFn; h.pendingAt = 0; h.pendingFn = null; this[fn](); this.changed(); }
      return;
    }
    if (h.simul) {
      const pend = this.pendingSimul(h);
      let i = 0;
      for (const id of pend) {
        if (!this.hand || this.hand !== h || !h.simul) break;
        const p = this.player(id);
        if (!p) this.autoSimul(id);
        else if (p.bot) { if (now >= h.botAt + i * 350) this.botSimul(id); i++; }
        else if (!p.connected || p.leaving || p.sittingOut) this.autoSimul(id);
      }
      if (this.hand === h && h.simul && now >= h.deadline) for (const id of this.pendingSimul(h)) { if (!h.simul) break; this.autoSimul(id); }
      return;
    }
    if (h.toAct) {
      const id = h.toAct, p = this.player(id);
      if (!p) return this.autoAct(id);
      if (p.bot) {
        if (!h.botAt) h.botAt = now + (h.kind === 'poker' ? 900 + this.rnd() * 1400 : 700 + this.rnd() * 600);
        else if (now >= h.botAt) { h.botAt = 0; this.botAct(id); }
      } else if (((!p.connected || p.leaving) && now >= h.turnStart + 1500) || now >= h.deadline) {
        if (now >= h.deadline && p.connected) this.addLog(`${p.name} ran out of time.`);
        this.autoAct(id);
      }
    }
  }
  setTurn(id) {
    const h = this.hand; const now = this.now();
    h.toAct = id; h.turnStart = now; h.deadline = now + this.settings.timer * 1000; h.botAt = 0;
  }
  endHand(delay) {
    const h = this.hand; h.over = true; h.toAct = null; h.pendingAt = 0; h.simul = false;
    this.nextHandAt = this.now() + delay;
  }
  startHand() {
    const game = this.settings.game, kind = GAMES[game].kind, st = this.stakes();
    const elig = this.seated().filter(p => !p.sittingOut && !p.leaving && p.chips > 0 && (p.bot || p.connected));
    if (kind === 'poker') { if (elig.length < 2) return false; this.startPoker(game, elig); }
    else {
      const e = elig.filter(p => p.chips >= st.bb * (kind === 'fourcard' ? 2 : 1));
      if (!e.length) return false;
      if (kind === 'blackjack') this.startBlackjack(e); else this.startFourCard(e);
    }
    this.changed(); return true;
  }
  act(pid, a) {
    const h = this.hand; if (!h || h.over || !h.seats[pid]) return;
    if (h.kind === 'poker') this.pokerAct(pid, a);
    else if (h.kind === 'blackjack') this.bjAct(pid, a);
    else this.fcAct(pid, a);
    this.changed();
  }
  autoAct(id) {
    const h = this.hand;
    if (h.kind === 'poker') {
      if (h.drawPhase) return this.act(id, { a: 'draw', idx: [] });
      const L = this.legal(id);
      return this.act(id, { a: L.canCheck ? 'check' : 'fold' });
    }
    if (h.kind === 'blackjack') return this.act(id, { a: 'stand' });
  }
  pendingSimul(h) {
    const o = h.order || [];
    if (h.kind === 'blackjack') {
      if (h.phase === 'bet') return o.filter(id => h.seats[id].bet === null && !h.seats[id].skipped);
      if (h.phase === 'insurance') return o.filter(id => h.seats[id].bet > 0 && h.seats[id].insurance === null);
    }
    if (h.kind === 'fourcard') {
      if (h.phase === 'bet') return o.filter(id => h.seats[id].ante === null && !h.seats[id].skipped);
      if (h.phase === 'decide') return o.filter(id => h.seats[id].ante > 0 && !h.seats[id].decided);
    }
    return [];
  }
  autoSimul(id) {
    const h = this.hand;
    if (h.phase === 'bet') return this.act(id, { a: 'skip' });
    if (h.phase === 'insurance') return this.act(id, { a: 'insurance', take: false });
    if (h.phase === 'decide') return this.act(id, { a: 'fold' });
  }

  // =================== POKER ===================
  commit(id, amt) {
    const p = this.player(id), s = this.hand.seats[id];
    const a = Math.max(0, Math.min(Math.floor(amt), p.chips));
    p.chips -= a; s.bet += a; s.total += a;
    if (p.chips === 0) s.allin = true;
    return a;
  }
  drawCard(h) {
    if (!h.deck.length) { h.deck = shuffle(h.muck); h.muck = []; }
    return h.deck.pop();
  }
  dealTo(id, up) { const h = this.hand; h.seats[id].cards.push({ c: this.drawCard(h), up }); }
  startPoker(game, elig) {
    const st = this.stakes(), g = GAMES[game];
    let bi = elig.findIndex(p => p.seat > this.buttonSeat); if (bi < 0) bi = 0;
    this.buttonSeat = elig[bi].seat;
    const ring = [...elig.slice(bi), ...elig.slice(0, bi)].map(p => p.id);
    const stud = game === 'stud7' || game === 'stud5';
    const h = this.hand = {
      kind: 'poker', type: game, limit: g.limit, no: ++this.handNo, deck: shuffle(newDeck()), muck: [], board: [],
      pot: 0, seats: {}, ring, button: ring[0], street: 0, stage: '', currentBet: 0, lastRaise: st.bb, raises: 0,
      toAct: null, over: false, sb: st.sb, bb: st.bb, betSize: st.bb, small: st.bb, big: st.bb * 2,
      ante: Math.max(1, Math.round(st.bb / 5)), bringIn: st.sb, bringStreet: false, drawPhase: false,
      results: null, pendingAt: 0, pendingFn: null, botAt: 0, deadline: 0, turnStart: 0,
    };
    for (const p of elig) h.seats[p.id] = { cards: [], bet: 0, total: 0, folded: false, allin: false, acted: false, mayRaise: true, last: '', shown: false, won: 0, drew: null, handName: '', cat: null, score: 0 };
    this.addLog(`Hand #${h.no} · ${g.label}${stud ? ` · ${fmt(h.small)}/${fmt(h.big)}` : ` · Blinds ${fmt(h.sb)}/${fmt(h.bb)}`}`);
    if (stud) {
      for (const id of ring) { const a = this.commit(id, h.ante); h.seats[id].bet -= a; h.pot += a; }
      const down = game === 'stud7' ? 2 : 1;
      for (let r = 0; r < down; r++) for (const id of ring) this.dealTo(id, false);
      for (const id of ring) this.dealTo(id, true);
      h.stage = game === 'stud7' ? 'Third Street' : 'Second Street';
      this.studBringIn();
    } else {
      const n = ring.length, sbI = n === 2 ? 0 : 1, bbI = n === 2 ? 1 : 2;
      this.commit(ring[sbI], h.sb); h.seats[ring[sbI]].last = 'Small Blind';
      this.commit(ring[bbI], h.bb); h.seats[ring[bbI]].last = 'Big Blind';
      h.currentBet = h.bb; h.lastRaise = h.bb;
      const nc = game === 'omaha' ? 4 : game === 'draw' ? 5 : 2;
      for (let r = 0; r < nc; r++) for (let i = 0; i < n; i++) this.dealTo(ring[(i + 1) % n], false);
      h.stage = game === 'draw' ? 'First Betting Round' : 'Pre-Flop';
      this.beginBetting((bbI + 1) % n);
    }
  }
  studBringIn() {
    const h = this.hand;
    h.bringStreet = true; h.betSize = h.small; h.raises = 0;
    const cands = h.ring.filter(id => !h.seats[id].allin);
    if (cands.length < 1) return this.endBetting();
    const upOf = id => { const u = h.seats[id].cards.filter(x => x.up); return u[u.length - 1].c; };
    let low = cands[0];
    for (const id of cands) if (lowCardValue(upOf(id)) < lowCardValue(upOf(low))) low = id;
    this.commit(low, h.bringIn); h.seats[low].last = 'Bring-in'; h.seats[low].acted = true;
    h.currentBet = h.bringIn;
    this.addLog(`${this.player(low).name} brings it in for ${fmt(h.bringIn)}.`);
    this.beginBetting(h.ring.indexOf(low) + 1);
  }
  canActIds() { const h = this.hand; return h.ring.filter(id => !h.seats[id].folded && !h.seats[id].allin); }
  isPending(id) {
    const h = this.hand, s = h.seats[id];
    if (s.folded || s.allin) return false;
    if (s.bet < h.currentBet) return true;
    return !s.acted && this.canActIds().length > 1;
  }
  nextPending(from) {
    const h = this.hand, n = h.ring.length;
    for (let i = 0; i < n; i++) { const id = h.ring[(((from % n) + n) + i) % n]; if (this.isPending(id)) return id; }
    return null;
  }
  beginBetting(startIdx) {
    const h = this.hand; h.toAct = null;
    const id = this.nextPending(startIdx);
    if (!id) return this.endBetting();
    this.setTurn(id);
  }
  legal(pid) {
    const h = this.hand, s = h.seats[pid], p = this.player(pid);
    const chips = p ? p.chips : 0;
    const toCall = Math.min(Math.max(0, h.currentBet - s.bet), chips);
    const stack = chips + s.bet;
    const bets = h.ring.reduce((a, id) => a + h.seats[id].bet, 0);
    const pot = h.pot + bets;
    const others = h.ring.filter(id => id !== pid && !h.seats[id].folded && !h.seats[id].allin).length;
    let canRaise = s.mayRaise && chips > toCall && others > 0;
    let minTo, maxTo, fullTo;
    if (h.limit === 'FL') {
      fullTo = (h.bringStreet && h.currentBet < h.betSize) ? h.betSize : h.currentBet + h.betSize;
      if (h.raises >= 4) canRaise = false;
      minTo = maxTo = Math.min(fullTo, stack);
    } else {
      fullTo = h.currentBet + h.lastRaise;
      minTo = Math.min(fullTo, stack); maxTo = stack;
      if (h.limit === 'PL') maxTo = Math.min(stack, Math.max(minTo, h.currentBet + pot + (h.currentBet - s.bet)));
    }
    return { toCall, canCheck: h.currentBet <= s.bet, canRaise, minTo, maxTo, fullTo, pot, isBet: h.currentBet === 0, limit: h.limit, myBet: s.bet, chips, bb: h.bb };
  }
  pokerAct(pid, a) {
    const h = this.hand;
    if (h.pendingAt || h.over) return;
    if (h.drawPhase) return this.drawAct(pid, a);
    if (h.toAct !== pid) return;
    const s = h.seats[pid], p = this.player(pid), L = this.legal(pid);
    let type = a.a;
    if (type === 'check' && !L.canCheck) return;
    if (type === 'call' && L.canCheck) type = 'check';
    if (type === 'raise' && !L.canRaise) type = L.canCheck ? 'check' : 'call';
    if (!['fold', 'check', 'call', 'raise'].includes(type)) return;
    const nm = p.name;
    if (type === 'fold') {
      s.folded = true; s.last = 'Fold'; h.muck.push(...s.cards.map(x => x.c));
      this.addLog(`${nm} folds.`);
    } else if (type === 'check') {
      s.last = 'Check'; this.addLog(`${nm} checks.`);
    } else if (type === 'call') {
      const amt = this.commit(pid, L.toCall);
      s.last = s.allin ? `All-in ${fmt(s.bet)}` : `Call ${fmt(amt)}`;
      this.addLog(`${nm} ${s.allin ? 'calls all-in for' : 'calls'} ${fmt(amt)}.`);
    } else {
      let to = Math.floor(+a.to || 0); if (!(to > 0)) to = L.minTo;
      to = Math.max(L.minTo, Math.min(L.maxTo, to));
      const prev = h.currentBet, raiseBy = to - prev;
      this.commit(pid, to - s.bet);
      const full = h.limit === 'FL' ? to >= L.fullTo : raiseBy >= h.lastRaise;
      if (full) {
        if (h.limit !== 'FL') h.lastRaise = Math.max(h.lastRaise, raiseBy);
        for (const id of h.ring) if (id !== pid) { h.seats[id].acted = false; h.seats[id].mayRaise = true; }
        h.raises++;
      } else {
        for (const id of h.ring) if (id !== pid) { const o = h.seats[id]; if (o.acted) o.mayRaise = false; o.acted = false; }
      }
      h.currentBet = Math.max(h.currentBet, to);
      const word = prev === 0 ? 'Bet' : (h.bringStreet && prev < h.betSize && h.raises === 1) ? 'Complete to' : 'Raise to';
      s.last = s.allin ? `All-in ${fmt(to)}` : `${word} ${fmt(to)}`;
      this.addLog(`${nm} ${s.allin ? 'goes all-in for' : word.toLowerCase()} ${fmt(to)}.`);
    }
    s.acted = true;
    const live = h.ring.filter(id => !h.seats[id].folded);
    if (live.length === 1) return this.awardUncontested(live[0]);
    const next = this.nextPending(h.ring.indexOf(pid) + 1);
    if (next) this.setTurn(next); else this.endBetting();
  }
  endBetting() {
    const h = this.hand; h.toAct = null;
    let maxId = null, max = -1, second = 0;
    for (const id of h.ring) {
      const b = h.seats[id].bet;
      if (b > max) { second = Math.max(second, max); max = b; maxId = id; } else if (b > second) second = b;
    }
    if (maxId && max > second) {
      const x = max - second, s = h.seats[maxId];
      s.bet -= x; s.total -= x; this.player(maxId).chips += x;
      if (s.allin) s.allin = false;
      this.addLog(`Uncalled ${fmt(x)} returned to ${this.player(maxId).name}.`);
    }
    for (const id of h.ring) { h.pot += h.seats[id].bet; h.seats[id].bet = 0; }
    h.currentBet = 0; h.raises = 0; h.bringStreet = false;
    h.pendingAt = this.now() + 750; h.pendingFn = 'pokerNextStreet';
  }
  pokerNextStreet() {
    const h = this.hand, t = h.type;
    for (const id of h.ring) {
      const s = h.seats[id]; s.acted = false; s.mayRaise = true;
      if (!s.folded) s.last = s.allin ? 'All-in' : '';
    }
    h.lastRaise = h.bb;
    if (t === 'holdem' || t === 'omaha') {
      if (h.street === 3) return this.pokerShowdown();
      h.muck.push(this.drawCard(h));
      const n = h.street === 0 ? 3 : 1;
      for (let i = 0; i < n; i++) h.board.push(this.drawCard(h));
      h.street++; h.stage = ['Pre-Flop', 'Flop', 'Turn', 'River'][h.street];
      this.beginBetting(1);
    } else if (t === 'draw') {
      if (h.street === 1) return this.pokerShowdown();
      h.street = 1; h.drawPhase = true; h.stage = 'The Draw';
      const first = this.nextDrawer(1);
      if (first) this.setTurn(first); else this.finishDraw();
    } else {
      const last = t === 'stud7' ? 4 : 3;
      if (h.street === last) return this.pokerShowdown();
      h.street++;
      const finalDown = t === 'stud7' && h.street === 4;

        dealer: { cards: d.hidden ? d.cards.map((c, i) => i === 1 ? '??' : c) : d.cards, hidden: d.hidden },
        legal: (h.phase === 'play' && h.toAct === pid) ? this.bjLegal(pid) : null,
        timeLeft: h.simul ? (pend.includes(pid) ? simulTime : null) : turnTime, busy: !!h.pendingAt,
        shoeLeft: this.shoe ? this.shoe.length : 0,

    }
    // four card
    const seats = {};
    for (const id of h.order) {
      const s = h.seats[id];
      const show = id === pid || h.dealer.revealed;
      seats[id] = Object.assign({}, s, { cards: show ? s.cards : s.cards.map(() => '??'), handName: show ? s.handName : '', cat: show ? s.cat : null, score: undefined });
    }
    const d = h.dealer;
    return Object.assign(base, {
      phase: h.phase, min: h.min, max: h.max, order: h.order, seats, pending: pend,
      dealer: { cards: d.revealed ? d.cards : d.cards.map((c, i) => i === 5 ? c : '??'), revealed: d.revealed, handName: d.revealed ? d.handName : '' },
      timeLeft: h.simul && pend.includes(pid) ? simulTime : null, busy: !!h.pendingAt,

// =====================================================================
//  BOTS  (house-run players that can fill empty seats)
// =====================================================================
const FINAL_CARDS = { holdem: 2, omaha: 4, draw: 5, stud7: 7, stud5: 5 };
const BOARD_CARDS = { holdem: 5, omaha: 5, draw: 0, stud7: 0, stud5: 0 };

function botDrawChoice(cards) { // returns indices to discard (max 3)
  const v = cards.map(c => RV[c[0]]);
  const sc = eval5(cards), cat = unpackScore(sc).cat;
  if (cat >= 4 && cat !== 7) return [];
  const counts = {}; v.forEach(x => counts[x] = (counts[x] || 0) + 1);
  if (cat === 7 || cat === 3 || cat === 2 || cat === 1) {
    const keep = new Set(v.filter(x => counts[x] >= 2));
    const idx = cards.map((c, i) => i).filter(i => !keep.has(v[i]));
    if (cat === 7) return idx; // keep quads, swap kicker? keep anyway
    return idx.slice(0, 3);
  }
  // four to a flush
  const suits = {}; cards.forEach(c => suits[c[1]] = (suits[c[1]] || 0) + 1);
  const fs = Object.keys(suits).find(s => suits[s] === 4);
  if (fs) return cards.map((c, i) => i).filter(i => cards[i][1] !== fs);
  // four to an open-ended straight
  const uniq = [...new Set(v)].sort((a, b) => a - b);
  for (let lo = 2; lo <= 11; lo++) {
    const run = [lo, lo + 1, lo + 2, lo + 3];
    if (run.every(r => uniq.includes(r))) {
      const used = new Set(); const keepIdx = [];
      cards.forEach((c, i) => { if (run.includes(v[i]) && !used.has(v[i])) { used.add(v[i]); keepIdx.push(i); } });
      return cards.map((c, i) => i).filter(i => !keepIdx.includes(i));
    }
  }
  // keep two highest cards
  const order = cards.map((c, i) => i).sort((a, b) => v[b] - v[a]);
  return order.slice(2);
}

function botEquity(t, h, pid, iters) {
  const me = h.seats[pid];
  const my = me.cards.map(x => x.c);
  const opps = h.ring.filter(id => id !== pid && !h.seats[id].folded);
  if (!opps.length) return 1;
  const known = new Set(my); h.board.forEach(c => known.add(c));
  const oppVis = {};
  for (const o of opps) { oppVis[o] = h.seats[o].cards.filter(x => x.up).map(x => x.c); oppVis[o].forEach(c => known.add(c)); }
  const pool = newDeck().filter(c => !known.has(c));
  const type = h.type, total = FINAL_CARDS[type], boardN = BOARD_CARDS[type];
  let myKeep = my;
  if (type === 'draw' && me.drew == null) { const d = botDrawChoice(my); myKeep = my.filter((c, i) => !d.includes(i)); }
  let wins = 0;
  const rnd = Math.random;
  for (let it = 0; it < iters; it++) {
    const deck = pool.slice(); let n = deck.length;
    const take = () => { const j = Math.floor(rnd() * n); const c = deck[j]; deck[j] = deck[--n]; return c; };
    const board = h.board.slice(); while (board.length < boardN) board.push(take());
    const mine = myKeep.slice(); while (mine.length < total) mine.push(take());
    const ms = t.pokerScore(type, mine, board);
    let best = true, ties = 0;
    for (const o of opps) {
      const oc = oppVis[o].slice(); while (oc.length < total) oc.push(take());
      const os = t.pokerScore(type, oc, board);
      if (os > ms) { best = false; break; }
      if (os === ms) ties++;
    }
    if (best) wins += 1 / (ties + 1);
  }
  return wins / iters;
}

function botPokerDecision(t, h, pid) {
  if (h.drawPhase) return { a: 'draw', idx: botDrawChoice(h.seats[pid].cards.map(x => x.c)) };
  const L = t.legal(pid), per = t.player(pid).persona;
  const opps = h.ring.filter(id => id !== pid && !h.seats[id].folded).length;
  const iters = h.type === 'omaha' ? 160 : 260;
  const eq = botEquity(t, h, pid, iters);
  const fair = 1 / (opps + 1);
  const betLine = fair + (1 - fair) * 0.28 + per.tight;
  const raiseLine = fair + (1 - fair) * 0.45 + per.tight;
  const r = t.rnd();
  const pot = L.pot, toCall = L.toCall;
  const early = (h.type === 'holdem' || h.type === 'omaha') ? [0.5, 0.78, 0.9, 1][h.street]
    : h.type === 'draw' ? [0.6, 1][h.street] : h.type === 'stud7' ? [0.55, 0.68, 0.8, 0.9, 1][h.street] : [0.6, 0.75, 0.9, 1][h.street];
  const raiseTo = frac => {
    let x = h.currentBet + Math.max(L.minTo - h.currentBet, Math.round((pot + toCall) * frac / L.bb) * L.bb);
    x = Math.max(L.minTo, Math.min(L.maxTo, x));
    // avoid reckless shoves with marginal hands
    if (x === L.maxTo && x > (pot + toCall) * 1.5 && eq < 0.7) x = Math.max(L.minTo, Math.min(L.maxTo, Math.round((pot + toCall) * 0.75)));
    return x;
  };
  if (L.canCheck) {
    if (L.canRaise && ((eq > betLine && r < 0.45 + per.aggr * 0.5) || r < per.bluff * 0.8))
      return { a: 'raise', to: raiseTo(0.45 + t.rnd() * 0.35 + (eq > 0.8 ? 0.3 : 0)) };
    return { a: 'check' };
  }
  const potOdds = toCall / (pot + toCall);
  const need = potOdds * early + per.tight;
  if (eq > need) {
    if (L.canRaise && eq > raiseLine && r < per.aggr) return { a: 'raise', to: raiseTo(0.65 + t.rnd() * 0.4) };
    return { a: 'call' };
  }
  if (r < per.bluff * 0.5 && toCall <= pot * 0.35) return { a: 'call' };
  return { a: 'fold' };
}

// ---- blackjack basic strategy (6 decks, dealer stands on soft 17, double after split) ----
function bjBotDecision(hand, up, L) {
  const d = bjRankVal(up); // 2..11
  const v = bjValue(hand.cards);
  const two = hand.cards.length === 2;
  if (L.split && two && bjRankVal(hand.cards[0]) === bjRankVal(hand.cards[1])) {
    const pv = bjRankVal(hand.cards[0]);
    const split = pv === 11 || pv === 8 || (pv === 9 && ![7, 10, 11].includes(d)) ||
      ((pv === 7 || pv === 2 || pv === 3) && d <= 7) || (pv === 6 && d <= 6) || (pv === 4 && (d === 5 || d === 6));
    if (split) return 'split';
  }
  const t = v.total;
  const dbl = act => (L.double ? 'double' : act);
  if (v.soft && t <= 21 && hand.cards.length >= 2) {
    if (t >= 20) return 'stand';
    if (t === 19) return d === 6 ? dbl('stand') : 'stand';
    if (t === 18) { if (d >= 2 && d <= 6) return dbl('stand'); if (d <= 8) return 'stand'; return 'hit'; }
    if (t === 17) return d >= 3 && d <= 6 ? dbl('hit') : 'hit';
    if (t >= 15) return d >= 4 && d <= 6 ? dbl('hit') : 'hit';
    return d >= 5 && d <= 6 ? dbl('hit') : 'hit';
  }
  if (t >= 17) return 'stand';
  if (t >= 13) return d <= 6 ? 'stand' : 'hit';
  if (t === 12) return d >= 4 && d <= 6 ? 'stand' : 'hit';
  if (t === 11) return d <= 10 ? dbl('hit') : 'hit';
  if (t === 10) return d <= 9 ? dbl('hit') : 'hit';
  if (t === 9) return d >= 3 && d <= 6 ? dbl('hit') : 'hit';
  return 'hit';
}

Table.prototype.botAct = function (id) {
  const h = this.hand;
  if (h.kind === 'poker') return this.act(id, botPokerDecision(this, h, id));
  if (h.kind === 'blackjack') {
    const s = h.seats[id], hand = s.hands[s.cur];
    return this.act(id, { a: bjBotDecision(hand, h.dealer.cards[0], this.bjLegal(id)) });
  }
};
Table.prototype.botSimul = function (id) {
  const h = this.hand, p = this.player(id), unit = h.min || 10;
  const pick = arr => arr[Math.floor(this.rnd() * arr.length)];
  if (h.kind === 'blackjack') {
    if (h.phase === 'bet') return this.act(id, { a: 'bet', amount: Math.min(p.chips, unit * pick([1, 1, 2, 2, 3, 4, 5])) });
    if (h.phase === 'insurance') return this.act(id, { a: 'insurance', take: false });
  }
  if (h.kind === 'fourcard') {
    if (h.phase === 'bet') return this.act(id, { a: 'bet', amount: unit * pick([1, 1, 2, 3]), aces: this.rnd() < 0.35 ? unit : 0 });
    if (h.phase === 'decide') {
      const { cat, k } = unpackScore(h.seats[id].score);
      if (cat >= 2 || (cat === 1 && k[0] >= 10)) return this.act(id, { a: 'play', mult: 3 });
      if (cat === 1 && k[0] >= 3) return this.act(id, { a: 'play', mult: 1 });
      return this.act(id, { a: 'fold' });
    }
  }
};

// ---- PeerJS loading ---------------------------------------------------
function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= PEERJS_SRC.length) return rej(new Error('Could not load the connection library. Check your internet connection and try again.'));
      const s = document.createElement('script'); s.src = PEERJS_SRC[i++];
      s.onload = () => window.Peer ? res() : next(); s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
function openPeer(id) {
  return new Promise((res, rej) => {
    const peer = new Peer(id, { config: { iceServers: ICE_SERVERS }, debug: 0 });
    let done = false;
    const to = setTimeout(() => { if (!done) { done = true; try { peer.destroy(); } catch (e) {} rej(new Error('The matchmaking service did not respond. Try again in a moment.')); } }, 12000);
    peer.on('open', () => { if (done) return; done = true; clearTimeout(to); res(peer); });
    peer.on('error', e => { if (done) return; done = true; clearTimeout(to); try { peer.destroy(); } catch (x) {} rej(e); });
  });
}

async function startHost(cfg) {
  busy('Opening your table…');

  let peer = null, code = null;
  for (let i = 0; i < 5 && !peer; i++) {

    catch (e) {

    }

  peer.on('error', e => { if (e && e.type !== 'peer-unavailable') console.warn('peer error', e.type); });

function hostConn(c) {
  c.on('data', d => {

    if (d.t === 'hello') {
      const id = String(d.id || '').slice(0, 40);
      if (!id || id === App.me.id || id.startsWith('bot-')) { c.send({ t: 'error', msg: 'Could not join this table.' }); return; }
      const r = App.table.join(id, d.name);
      if (!r.ok) { c.send({ t: 'error', msg: r.msg }); setTimeout(() => { try { c.close(); } catch (e) {} }, 600); return; }
      const old = App.conns.get(id);

      c.pid = id; App.conns.set(id, c); scheduleSync();

    if (c.pid && App.conns.get(c.pid) === c) {

async function startJoin(code) {
  busy(`Finding table ${code}…`);
  try { await loadPeer(); } catch (e) { closeModal(); return toast(e.message, 6000); }
  const peer = new Peer({ config: { iceServers: ICE_SERVERS }, debug: 0 });
  App.peer = peer; App.mode = 'client'; App.code = code; App.leaving = false;
  let opened = false, failed = false;
  const fail = msg => {
    if (failed || App.peer !== peer) return; failed = true;
    clearTimeout(timer); cleanup(); closeModal(); showLobby(); toast(msg, 7000);
  };
  const timer = setTimeout(() => { if (!opened) fail(`Could not connect to table ${code}. Double-check the code. If it is right, a strict network may be blocking the connection — try switching between Wi-Fi and cell data.`); }, 16000);
  peer.on('error', e => {
    if (e && e.type === 'peer-unavailable') fail(`No open table found with code ${code}.`);

  });

  });
}

    <label class="field"><span>Game</span><select id="sGame">${optionList(GAME_OPTS, s.game)}</select></label>
    <div class="row2"><label class="field"><span>Stakes</span><select id="sStakes">${optionList(STAKE_OPTS, s.stakes)}</select></label>
    <label class="field"><span>Starting chips / rebuy</span><select id="sStack">${optionList(STACK_OPTS.some(o => o[0] === s.startStack) ? STACK_OPTS : STACK_OPTS.concat([[s.startStack, fmt(s.startStack)]]), s.startStack)}</select></label></div>
    <label class="field"><span>Turn timer</span><select id="sTimer">${optionList(TIMER_OPTS, s.timer)}</select></label>
    <label class="field"><span>House bots · ${bots} seated · ${open} open seat${open === 1 ? '' : 's'}</span></label>
    <div class="botrow"><button class="btn" data-cmd="addBot"${open ? '' : ' disabled'}>+ Add Bot</button><button class="btn" data-cmd="removeBot"${bots ? '' : ' disabled'}>− Remove Bot</button><button class="btn" data-cmd="fillBots"${open ? '' : ' disabled'}>Fill Empty Seats</button><button class="btn" data-cmd="clearBots"${bots ? '' : ' disabled'}>Remove All Bots</button></div>
    <label class="field"><span>At the table</span></label><div class="plist">${plist}</div>
    <div class="mfoot"><button class="btn ghost" data-close>Close</button><button class="btn primary" id="sSave">Save Changes</button></div>`);
  $('#sSave').onclick = () => {
    send({ t: 'settings', s: { game: $('#sGame').value, stakes: +$('#sStakes').value, startStack: +$('#sStack').value, timer: +$('#sTimer').value } });
    closeModal(); toast('Settings saved.');
  };
}

// ---- input handling ---------------------------------------------------
function requireName() {
  const n = $('#nameInput').value.replace(/[<>]/g, '').trim().slice(0, 16);
  if (!n) { toast('Enter your name first.'); $('#nameInput').focus(); return null; }
  store.set('name', n); App.me.name = n; return n;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-cmd],[data-pick],[data-add],[data-pre],[data-close],[data-kick],[data-guide-close]');
  if (!t) return;
  const v = App.view, h = v && v.hand;
  if (t.hasAttribute('data-close')) { closeModal(); return; }
  if (t.hasAttribute('data-guide-close')) { $('#btnGuide').click(); return; }
  if (t.dataset.kick) { send({ t: 'kick', id: t.dataset.kick }); setTimeout(settingsModal, 120); return; }
  if (t.dataset.cmd) {
    const c = t.dataset.cmd;
    if (c === 'sitout') { send({ t: 'sitout', v: t.checked }); return; }
    if (c === 'pause') { send({ t: 'pause', v: t.dataset.v === '1' }); return; }
    send({ t: c });
    if (!$('#modal').classList.contains('hidden') && ['addBot', 'removeBot', 'fillBots', 'clearBots'].includes(c)) setTimeout(settingsModal, 120);
    return;
  }
  if (t.dataset.pick != null) {
    const i = +t.dataset.pick;
    if (App.sel.has(i)) App.sel.delete(i); else if (App.sel.size < 3) App.sel.add(i); else toast('You can discard up to 3 cards.');
    App.abSig = ''; render(); return;
  }
  if (t.dataset.add) {
    const add = +t.dataset.add, me = meP(v);
    const max = h.kind === 'fourcard' ? Math.min(h.max, Math.floor(me.chips / 2)) : Math.min(h.max, me.chips);
    App.betAmt = Math.min(max, (App.betAmt || 0) + add); App.abSig = ''; render(); return;
  }
  if (t.dataset.pre) {
    const x = +t.dataset.pre; App.raiseVal = x;
    const rg = $('#raiseRange'), am = $('#raiseAmt'), l = $('#raiseLbl');
    if (rg) rg.value = x; if (am) am.value = x; if (l) l.textContent = fmt(x); return;
  }
  const a = t.dataset.act; if (!a || !h) return;
  switch (a) {
    case 'fold': case 'check': case 'call': act({ a }); break;
    case 'raise': act({ a: 'raise', to: t.dataset.to ? +t.dataset.to : App.raiseVal }); break;
    case 'draw': act({ a: 'draw', idx: [...App.sel] }); App.sel.clear(); break;
    case 'bet': act({ a: 'bet', amount: App.betAmt }); break;
    case 'fcbet': act({ a: 'bet', amount: App.betAmt, aces: App.aces ? App.betAmt : 0 }); break;
    case 'skip': act({ a: 'skip' }); break;
    case 'clear': App.betAmt = 0; App.abSig = ''; render(); break;
    case 'aces': App.aces = t.checked; App.abSig = ''; render(); break;
    case 'insure': act({ a: 'insurance', take: t.dataset.v === '1' }); break;
    case 'hit': case 'stand': case 'double': case 'split': act({ a }); break;
    case 'play': act({ a: 'play', mult: +t.dataset.v }); break;
    case 'fcfold': act({ a: 'fold' }); break;
  }
});
// keep the draw selection tied to the current draw turn
setInterval(() => {
  const h = App.view && App.view.hand;
  const key = h && h.drawPhase && h.toAct === App.view.me ? h.no + '|draw' : '';
  if (key !== App.selKey) { App.selKey = key; if (App.sel.size) { App.sel.clear(); App.abSig = ''; if (App.inTable) render(); } }
}, 300);

function onResize() {
  App.portrait = window.innerWidth < 760 && window.innerHeight > window.innerWidth * 1.05;
  if (App.inTable && App.view) { App.abSig = ''; render(); }
}
window.addEventListener('resize', onResize);

function init() {
  $('#nameInput').value = store.get('name', '');
  const q = new URLSearchParams(location.search).get('room');
  if (q) { $('#codeInput').value = q.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); }
  $('#codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
  $('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
  $('#btnHost').onclick = () => { if (requireName()) setupModal('host'); };
  $('#btnSolo').onclick = () => { if (requireName()) setupModal('solo'); };
  $('#btnJoin').onclick = () => {
    if (!requireName()) return;
    const code = $('#codeInput').value.trim().toUpperCase();
    if (code.length !== 5) { toast('Room codes are 5 characters.'); $('#codeInput').focus(); return; }
    startJoin(code);
  };
  $('#roomCode').onclick = () => {
    if (App.mode === 'solo' || !App.code) return;
    const link = location.origin + location.pathname + '?room=' + App.code;
    const done = () => toast(`Invite link copied · Room ${App.code}`);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(link).then(done, () => toast(`Room code ${App.code} · ${link}`, 8000));
    else toast(`Room code ${App.code} · ${link}`, 8000);
  };
  $('#btnGuide').onclick = () => {
    App.guideOpen = !App.guideOpen; $('#guide').classList.toggle('open', App.guideOpen);
    $('.table-area').classList.toggle('guide-on', App.guideOpen); $('#btnGuide').classList.toggle('on', App.guideOpen); setTimeout(onResize, 260);
    if (App.guideOpen && App.view) { App.guideSig = ''; const h = App.view.hand; renderGuide(h ? h.type : App.view.settings.game, h); }
  };
  $('#btnSettings').onclick = settingsModal;
  $('#btnPanel').onclick = () => { $('#side').classList.toggle('open'); App.feedSig = ''; if (App.view) renderSide(App.view); };
  $('#btnSound').onclick = () => { App.sound = !App.sound; store.set('sound', App.sound ? '1' : '0'); $('#btnSound').textContent = App.sound ? 'Sound On' : 'Sound Off'; if (App.sound) chime(); };
  $('#btnLeave').onclick = leaveTable;
  for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => {
    App.tab = b.dataset.tab; for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    App.feedSig = ''; if (App.view) renderSide(App.view);
  };
  $('#chatForm').onsubmit = e => { e.preventDefault(); const i = $('#chatInput'); const m = i.value.trim(); if (m) { send({ t: 'chat', m }); i.value = ''; } };
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#modalCard').querySelector('.spinner')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden') && !$('#modalCard').querySelector('.spinner')) closeModal(); else if (App.guideOpen) $('#btnGuide').click(); } });
  onResize();
}
init();
</script>
</body>
</html>
